<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Hub</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #f3f4f6;
            --card-bg: #ffffff;
            --primary-orange: #f97316;
            --primary-orange-hover: #ea580c;
            --primary-orange-light: #fff7ed;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        aside {
            width: var(--sidebar-width);
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            padding: 0 12px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9fafb;
            color: var(--text-dark);
        }

        .nav-item.active {
            background: var(--primary-orange-light);
            color: var(--primary-orange);
        }

        /* Main Area */
        main {
            flex-grow: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .header-titles h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-titles p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            outline: none;
            font-size: 0.9rem;
        }

        .btn-orange {
            background: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-orange:hover {
            background: var(--primary-orange-hover);
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Prompt Grid */
        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .prompt-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--primary-orange);
        }

        .card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #e5e7eb;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.825rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detail Modal (Floating Card Style like Screenshot) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            width: 420px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .modal-field input, .modal-field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-item .lbl { font-size: 0.75rem; color: var(--text-muted); }
        .info-item .val { font-size: 0.85rem; font-weight: 600; }

        .btn-danger-text {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            padding: 8px;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div class="logo">AI Prompt Hub</div>
        <ul class="nav-list">
            <li class="nav-item active">🏠 خانه</li>
            <li class="nav-item">📊 داشبورد</li>
            <li class="nav-item">🖼 مجموعه‌ها</li>
            <li class="nav-item" id="userMenuBtn">👤 حساب کاربری</li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main>
        <div class="top-header">
            <div class="header-titles">
                <h1 id="welcomeTitle">روز بخیر!</h1>
                <p>کتابخانه پرامپت‌های شما</p>
            </div>
            <div class="top-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="جستجو...">
                </div>
                <button class="btn-orange" id="openUploadBtn">+ پرامپت جدید</button>
            </div>
        </div>

        <div class="section-title">پرامپت‌های اخیر شما</div>
        <div class="prompt-grid" id="promptGrid">
            <!-- کارت‌ها به صورت پویا بارگذاری می‌شوند -->
        </div>
    </main>

    <!-- Prompt Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <img src="" id="detailImg" class="modal-img" alt="Preview">
            
            <div class="modal-field">
                <label>عنوان</label>
                <input type="text" id="detailTitle">
            </div>

            <div class="modal-field">
                <label>متن پرامپت</label>
                <textarea id="detailPrompt" rows="4"></textarea>
            </div>

            <button class="btn-orange" id="copyBtn">کپی پرامپت</button>

            <div class="modal-info-grid">
                <div class="info-item">
                    <span class="lbl">فرمت</span>
                    <span class="val" id="detailFormat">PNG</span>
                </div>
                <div class="info-item">
                    <span class="lbl">دسته‌بندی</span>
                    <span class="val" id="detailCategory">عمومی</span>
                </div>
                <div class="info-item">
                    <span class="lbl">نوع</span>
                    <span class="val">تصویر</span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <button class="btn-danger-text" id="closeDetailBtn">بستن</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <h3>ثبت پرامپت جدید</h3>
            
            <div class="modal-field">
                <label>عنوان</label>
                <input type="text" id="newTitle" placeholder="مثلاً: Neon Dreamscape">
            </div>

            <div class="modal-field">
                <label>دسته‌بندی</label>
                <input type="text" id="newCategory" placeholder="مثلاً: Cyberpunk">
            </div>

            <div class="modal-field">
                <label>متن پرامپت</label>
                <textarea id="newPrompt" rows="3" placeholder="متن پرامپت را وارد کنید..."></textarea>
            </div>

            <div class="modal-field">
                <label>لینک تصویر پیش‌نمایش</label>
                <input type="text" id="newImage" placeholder="https://...">
            </div>

            <button class="btn-orange" id="submitUploadBtn">ذخیره پرامپت</button>
            <button class="btn-danger-text" id="closeUploadBtn">انصراف</button>
        </div>
    </div>

    <script>
        // Supabase Client
        const SUPABASE_URL = 'https://jquqnzjcmpypadififzj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdXFuempjbXB5cGFkaWZpZnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTEyMDEsImV4cCI6MjEwMzc2NzIwMX0.9uiEUgJtoc98xbpUw6JgTRlfhRtFQE0ixZuz0Xx931s';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const promptGrid = document.getElementById('promptGrid');
        const detailModal = document.getElementById('detailModal');
        const uploadModal = document.getElementById('uploadModal');

        // Load Prompts
        async function fetchPrompts() {
            promptGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">در حال بارگذاری...</p>';
            const { data, error } = await supabaseClient.from('prompts').select('*');

            if (error || !data || data.length === 0) {
                promptGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">هیچ پرامپتی یافت نشد.</p>';
                return;
            }

            promptGrid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'prompt-card';
                card.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/300x180'}" class="card-img" alt="Card Preview">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.prompt}</div>
                `;
                card.onclick = () => openDetail(item);
                promptGrid.appendChild(card);
            });
        }

        function openDetail(item) {
            document.getElementById('detailImg').src = item.image || 'https://via.placeholder.com/300x180';
            document.getElementById('detailTitle').value = item.title;
            document.getElementById('detailPrompt').value = item.prompt;
            document.getElementById('detailCategory').innerText = item.category || 'عمومی';
            
            document.getElementById('copyBtn').onclick = () => {
                navigator.clipboard.writeText(item.prompt);
                alert('پرامپت کپی شد!');
            };

            detailModal.style.display = 'flex';
        }

        document.getElementById('closeDetailBtn').onclick = () => detailModal.style.display = 'none';

        // Upload Modal Handlers
        document.getElementById('openUploadBtn').onclick = () => uploadModal.style.display = 'flex';
        document.getElementById('closeUploadBtn').onclick = () => uploadModal.style.display = 'none';

        document.getElementById('submitUploadBtn').onclick = async () => {
            const title = document.getElementById('newTitle').value.trim();
            const category = document.getElementById('newCategory').value.trim();
            const prompt = document.getElementById('newPrompt').value.trim();
            const image = document.getElementById('newImage').value.trim();

            if (!title || !prompt) {
                alert('لطفاً عنوان و متن پرامپت را وارد کنید.');
                return;
            }

            const { error } = await supabaseClient.from('prompts').insert([{
                title, category, prompt, image, fileName: title, isVideo: false
            }]);

            if (error) {
                alert('خطا در ثبت پرامپت: ' + error.message);
            } else {
                uploadModal.style.display = 'none';
                fetchPrompts();
            }
        };

        fetchPrompts();
    </script>
</body>
</html>
