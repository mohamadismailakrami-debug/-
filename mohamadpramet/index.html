<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Hub</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #f3f4f6;
            --card-bg: #ffffff;
            --primary-orange: #f97316;
            --primary-orange-hover: #ea580c;
            --primary-orange-light: #fff7ed;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        aside {
            width: var(--sidebar-width);
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            padding: 0 12px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9fafb;
            color: var(--text-dark);
        }

        .nav-item.active {
            background: var(--primary-orange-light);
            color: var(--primary-orange);
        }

        /* Main Area */
        main {
            flex-grow: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .header-titles h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-titles p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-orange {
            background: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-orange:hover {
            background: var(--primary-orange-hover);
        }

        .btn-orange:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Prompt Grid */
        .prompt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .prompt-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .prompt-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--primary-orange);
        }

        .card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #e5e7eb;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.825rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            width: 420px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .modal-field input, .modal-field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-danger-text {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            padding: 8px;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div class="logo">AI Prompt Hub</div>
        <ul class="nav-list">
            <li class="nav-item active">🏠 خانه</li>
            <li class="nav-item" id="accountBtn">👤 ورود / حساب</li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main>
        <div class="top-header">
            <div class="header-titles">
                <h1 id="userGreeting">روز بخیر!</h1>
                <p>کتابخانه پرامپت‌های شما</p>
            </div>
            <div class="top-actions">
                <button class="btn-orange" id="openUploadBtn">+ پرامپت جدید</button>
            </div>
        </div>

        <div class="section-title">پرامپت‌های اخیر شما</div>
        <div class="prompt-grid" id="promptGrid"></div>
    </main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <h3>ورود به حساب کاربری</h3>
            <div class="modal-field">
                <label>ایمیل</label>
                <input type="email" id="authEmail" placeholder="ایمیل خود را وارد کنید...">
            </div>
            <button class="btn-orange" id="submitAuthBtn">ورود</button>
            <button class="btn-danger-text" id="closeAuthBtn">انصراف</button>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <img src="" id="detailImg" class="modal-img" alt="Preview">
            <div class="modal-field">
                <label>عنوان</label>
                <input type="text" id="detailTitle" readonly>
            </div>
            <div class="modal-field">
                <label>متن پرامپت</label>
                <textarea id="detailPrompt" rows="4" readonly></textarea>
            </div>
            <button class="btn-orange" id="copyBtn">کپی پرامپت</button>
            <button class="btn-danger-text" id="closeDetailBtn">بستن</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <h3>ثبت پرامپت جدید</h3>
            
            <div class="modal-field">
                <label>عنوان *</label>
                <input type="text" id="newTitle" placeholder="مثلاً: Neon Dreamscape">
            </div>

            <div class="modal-field">
                <label>دسته‌بندی</label>
                <input type="text" id="newCategory" placeholder="مثلاً: Cyberpunk">
            </div>

            <div class="modal-field">
                <label>متن پرامپت *</label>
                <textarea id="newPrompt" rows="3" placeholder="متن پرامپت را وارد کنید..."></textarea>
            </div>

            <div class="modal-field">
                <label>انتخاب تصویر (اختیاری)</label>
                <input type="file" id="newImageFile" accept="image/*">
            </div>

            <button class="btn-orange" id="submitUploadBtn">ذخیره و آپلود</button>
            <button class="btn-danger-text" id="closeUploadBtn">انصراف</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jquqnzjcmpypadififzj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdXFuempjbXB5cGFkaWZpZnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTEyMDEsImV4cCI6MjEwMzc2NzIwMX0.9uiEUgJtoc98xbpUw6JgTRlfhRtFQE0ixZuz0Xx931s';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const promptGrid = document.getElementById('promptGrid');
        const detailModal = document.getElementById('detailModal');
        const uploadModal = document.getElementById('uploadModal');
        const authModal = document.getElementById('authModal');
        const submitBtn = document.getElementById('submitUploadBtn');
        
        let currentUser = localStorage.getItem('user_email') || null;

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('userGreeting').innerText = `خوش آمدید، ${currentUser.split('@')[0]}`;
                document.getElementById('accountBtn').innerText = '👤 خروج از حساب';
            } else {
                document.getElementById('userGreeting').innerText = 'روز بخیر!';
                document.getElementById('accountBtn').innerText = '👤 ورود / حساب';
            }
        }

        // Account Modal Handlers
        document.getElementById('accountBtn').onclick = () => {
            if (currentUser) {
                currentUser = null;
                localStorage.removeItem('user_email');
                updateAuthUI();
            } else {
                authModal.style.display = 'flex';
            }
        };

        document.getElementById('closeAuthBtn').onclick = () => authModal.style.display = 'none';

        document.getElementById('submitAuthBtn').onclick = () => {
            const email = document.getElementById('authEmail').value.trim();
            if (email) {
                currentUser = email;
                localStorage.setItem('user_email', email);
                authModal.style.display = 'none';
                updateAuthUI();
            }
        };

        // Fetch Prompts
        async function fetchPrompts() {
            promptGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">در حال بارگذاری...</p>';
            const { data, error } = await supabaseClient.from('prompts').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error("Fetch error:", error);
            }

            if (!data || data.length === 0) {
                promptGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">هیچ پرامپتی یافت نشد.</p>';
                return;
            }

            promptGrid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'prompt-card';
                card.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/300x180?text=No+Image'}" class="card-img" alt="Preview">
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.prompt}</div>
                `;
                card.onclick = () => openDetail(item);
                promptGrid.appendChild(card);
            });
        }

        function openDetail(item) {
            document.getElementById('detailImg').src = item.image || 'https://via.placeholder.com/300x180?text=No+Image';
            document.getElementById('detailTitle').value = item.title;
            document.getElementById('detailPrompt').value = item.prompt;
            
            document.getElementById('copyBtn').onclick = () => {
                navigator.clipboard.writeText(item.prompt);
                alert('پرامپت کپی شد!');
            };

            detailModal.style.display = 'flex';
        }

        document.getElementById('closeDetailBtn').onclick = () => detailModal.style.display = 'none';
        document.getElementById('openUploadBtn').onclick = () => uploadModal.style.display = 'flex';
        document.getElementById('closeUploadBtn').onclick = () => uploadModal.style.display = 'none';

        // Upload Process
        submitBtn.onclick = async () => {
            const title = document.getElementById('newTitle').value.trim();
            const category = document.getElementById('newCategory').value.trim() || 'General';
            const prompt = document.getElementById('newPrompt').value.trim();
            const fileInput = document.getElementById('newImageFile');
            const file = fileInput.files[0];

            if (!title || !prompt) {
                alert('لطفاً عنوان و متن پرامپت را وارد کنید.');
                return;
            }

            // تغییر حالت دکمه به در حال آپلود
            submitBtn.disabled = true;
            submitBtn.innerText = 'در حال ذخیره...';

            let imageUrl = '';

            try {
                if (file) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabaseClient
                        .storage
                        .from('prompt-images')
                        .upload(fileName, file);

                    if (uploadError) {
                        throw new Error('خطا در آپلود تصویر: ' + uploadError.message);
                    }

                    const { data: urlData } = supabaseClient
                        .storage
                        .from('prompt-images')
                        .getPublicUrl(fileName);

                    imageUrl = urlData.publicUrl;
                }

                // ثبت در دیتابیس
                const { error: dbError } = await supabaseClient.from('prompts').insert([{
                    title: title,
                    category: category,
                    prompt: prompt,
                    image: imageUrl,
                    fileName: title,
                    isVideo: false
                }]);

                if (dbError) {
                    throw new Error('خطا در ثبت جدول: ' + dbError.message);
                }

                alert('پرامپت با موفقیت ذخیره شد!');
                uploadModal.style.display = 'none';
                
                // پاک‌سازی فرم
                document.getElementById('newTitle').value = '';
                document.getElementById('newCategory').value = '';
                document.getElementById('newPrompt').value = '';
                fileInput.value = '';

                fetchPrompts();

            } catch (err) {
                alert(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ذخیره و آپلود';
            }
        };

        updateAuthUI();
        fetchPrompts();
    </script>
</body>
</html>
